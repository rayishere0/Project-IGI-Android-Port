apply plugin: 'com.android.application'

android {
    namespace "com.projectigi.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.projectigi.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
}

// Fail fast when the managed assemblies were never deployed. A Gradle-only build
// ships whatever DLLs are committed under src/main/assets/managed, and those
// predate the co-op code — OpenIGI.Net.dll was never committed at all. Without
// this check the build succeeds and the game simply has no co-op in it: no icon,
// no Co-op screen, no coop_loopback command. The fix is to run
// deploy_managed_assets.ps1 from the repo root first, then re-run Gradle.
// Extend `required` when the source gains a new managed assembly the game
// cannot run without; keep the list to assemblies whose absence proves stale DLLs.
tasks.register('checkManagedAssemblies') {
    doLast {
        def managedDir = file('src/main/assets/managed')
        def required = ['OpenIGI.Net.dll', 'OpenIGI.Net.Udp.dll']
        def missing = required.findAll { !new File(managedDir, it).exists() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Managed assemblies missing from src/main/assets/managed: ${missing.join(', ')}. " +
                "Run deploy_managed_assets.ps1 from the repo root first (it builds the .NET " +
                "assemblies and copies them here), then re-run the Gradle build. " +
                "A Gradle-only build ships the DLLs committed in the repo, which predate co-op.")
        }
    }
}
tasks.named('preBuild') { dependsOn('checkManagedAssemblies') }

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.activity:activity:$rootProject.ext.androidxActivityVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "androidx.documentfile:documentfile:1.0.1"

    // Capacitor Android bridge
    implementation project(':capacitor-android')

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
}
